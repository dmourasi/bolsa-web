[project]
name = "bolsa-web"
version = "0.1.0"
description = "Public web platform: upload a Lattes CV and see the funding you can apply for"
requires-python = ">=3.11"
dependencies = [
    "bolsa-core",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
bolsa-web = "bolsa_web.server:main"

[tool.uv.sources]
bolsa-core = { git = "https://github.com/dmourasi/bolsa-core" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bolsa_web"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
